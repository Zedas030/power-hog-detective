# =====================================================================================
#  Power Hog Detective – configuration
#  After changes:  docker compose restart
#  Durations: 90s, 15m, 3h, 2d   ·   The Home Assistant token is NOT here but in ../.env
#  German keys (e.g. geraete, typ: zyklus) are accepted as aliases.
# =====================================================================================

language: en                            # en | de – notifications, web UI, reports, HA sensor states
# app_name: Power Hog Detective         # title of notifications and pages
# short_name: Power Hog                 # prefix of HA sensor names

home_assistant:
  url: http://127.0.0.1:8123            # the container runs in the host network
  notify: notify.mobile_app_phone       # notifications (with a "Was ok" button on the companion app)
  additional_persistent: false          # true = also as a notification in the HA UI
  sensor_prefix: power_hog              # own sensors are called sensor.power_hog_*, event power_hog_feedback

prometheus:
  url: http://127.0.0.1:9090            # only used to pre-learn from the past (HA's Prometheus exporter)

web:
  port: 8101                            # web UI, /metrics, /health
  address: 192.0.2.10                   # only used for links in notifications

timezone: Europe/Berlin

prices:
  import_eur_kwh: 0.34                  # electricity price
  export_eur_kwh: 0.00                  # feed-in tariff

learning:
  min_days: 14                          # compare and alert only after this many days
  window_days: 28                       # sliding learning window: slow changes become the new normal
  max_excluded_days: 14                 # a deviation lasting this long is learned as the new normal automatically
  min_days_after_feedback: 3            # after "Was ok": days of the new normal before comparing again
  prelearn_days: 35                     # how far `sfd prelearn` looks back

detection:
  stable_days: 3                        # noise suppression: alert only after this many days of stable deviation
  rel_threshold: 0.25                   # at least 25 % away from the learned normal …
  z_threshold: 3.0                      # … and at least 3 robust standard deviations
  normal_days_to_clear: 2               # normal days until a finding counts as resolved
  notify_recovery: true                 # send "… is back to normal"
  program_deviation: 0.3                # program devices: a run 30 % longer / more energy than the learned program
  program_stable_runs: 2                # … in at least 2 of the last 3 runs

monitoring:                             # self-monitoring
  unavailable_after: 30m                # push when a plug is "unavailable"/"unknown" this long (connection lost)
  no_data_after: 30m                    # plug sends no fresh values (shown in the web UI only) …
  notify_no_data: false                 # … true = also push (annoying for rarely used devices)
  ha_down_after: 5m                     # Home Assistant unreachable (notification is sent once it is back)
  house_data_missing_after: 30m         # whole-house meter values missing
  poll_interval: 60s                    # in addition to the live connection: poll all entities
  registry_check: 10m                   # detect renamed or missing entities

storage:
  path: /data/power-hog.sqlite
  write_interval: 60s                   # write readings in batches (gentle on SD cards)
  raw_days: 14                          # raw readings
  minute_days: 90                       # then minute averages
  quarter_hour_days: 730                # then 15-minute averages; hourly energy, daily features and runs are kept

report:
  day: 1                                # monthly report on the 1st …
  time: "07:00"                         # … at 07:00 (HTML in the web UI + summary via notify)
  directory: /data/reports
  fridge_reference_kwh_year: 150        # reference for an efficient fridge
  water_heater_saving_share: 0.3        # assumption for a water-saving shower head
  base_load_saving_share: 0.3           # assumption: share of the unassigned base load that is avoidable
  notes: []                             # own notes printed in every report

house:
  # Whole-house meter (power in W). consumption is required, grid_import/grid_export are optional.
  # With a meter: night base load of the house, load no plug sees, grid/solar share and a water-heater estimate.
  consumption:                          # e.g. sensor.electricity_meter_power
  grid_import:                          # e.g. sensor.electricity_meter_import_power
  grid_export:                          # e.g. sensor.electricity_meter_export_power
  solar_into_house:                     # power PV/battery feed into the house (solar share in the report;
    - sensor.battery_output_power       # estimated when there is no meter)
  night_from: "01:00"                   # window for the night base load
  night_to: "05:00"
  water_heater:                         # not in HA: estimated from large load peaks that no plug sees
    enabled: true
    name: Instantaneous water heater
    threshold_w: 3000

# -------------------------------------------------------------------------------------
# Devices. type: cycle | continuous | program | usage | charger | schedule
# Optional per device:
#   max_runtime: 4h           alert when the device runs longer in one go (the iron case);
#                             without it the limit is learned (cycle, program, usage, schedule)
#   learn_runtime: false      switch off the learned runtime limit
#   zero_alert_after: 30m     alert when the device draws 0 W although the plug is on
#                             (default: continuous 15m, cycle learned, otherwise off)
#   on_threshold_w: 15        from this power on the device counts as "running"
#   profile: fridge | water_heater | dishwasher | washing_machine | dryer | printer   (fitting tips)
#   detect_programs: false    switch off program detection (e.g. 3D printer: every print is different)
#   liveness: sensor.x        sensor of the same plug that proves it is alive (default: found automatically,
#                             e.g. the voltage sensor)
#   history: [...]            old entity ids (before a rename) for pre-learning from Prometheus
#   enabled: false            ignore the device for now
# -------------------------------------------------------------------------------------
devices:
  fridge:
    name: Fridge
    type: cycle
    profile: fridge
    power: sensor.fridge_power
    switch: switch.fridge
  water_heater_kitchen:
    name: Kitchen water heater
    type: cycle
    profile: water_heater
    power: sensor.kitchen_boiler_power
    switch: switch.kitchen_boiler
    on_threshold_w: 50
  router:
    name: Router
    type: continuous
    power: sensor.router_power
    switch: switch.router
  dishwasher:
    name: Dishwasher
    type: program
    profile: dishwasher
    power: sensor.dishwasher_power
    switch: switch.dishwasher
    max_runtime: 5h
  printer_3d:
    name: 3D printer
    type: program
    profile: printer
    detect_programs: false
    learn_runtime: false
    max_runtime: 30h
    power: sensor.printer_power
  pc:
    name: PC
    type: usage
    on_threshold_w: 25
    power: sensor.pc_power
    switch: switch.pc
  tv:
    name: TV
    type: usage
    power: sensor.tv_power
    switch: switch.tv
  tablet_dock:
    name: Tablet dock
    type: charger
    power: sensor.tablet_dock_power
  grow_tent:
    name: Grow tent
    type: schedule
    on_threshold_w: 150                 # fan always runs (~80 W), "on" = the lamp
    power: sensor.grow_tent_power
